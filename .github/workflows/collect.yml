name: Collect & Compile Rule Sets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      allow_large_changes:
        description: Accept reviewed changes exceeding count/coverage limits
        type: boolean
        default: false
  pull_request:
  push:
    paths:
      - scripts/**
      - config.yml
      - requirements.txt
      - tests/**
      - data/**
      - .github/workflows/collect.yml

permissions:
  contents: read

concurrency:
  group: subnet-compiler-${{ github.ref }}
  cancel-in-progress: false

env:
  SING_BOX_VERSION: "1.13.12"
  SING_BOX_SHA256: "1540533adb3df24f5ad5f14b5c7ca3dbc2401b10a1c1eb278fcadcada47ec6c4"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.7"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Cache sing-box archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/sing-box-cache
          key: sing-box-archive-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.SING_BOX_VERSION }}-${{ env.SING_BOX_SHA256 }}
      - name: Install verified sing-box
        shell: bash
        run: |
          set -euo pipefail
          archive="sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/sing-box-cache"
          cached="$RUNNER_TEMP/sing-box-cache/$archive"
          if [ ! -f "$cached" ]; then
            curl --fail --location --retry 3 --max-time 120 \
              "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${archive}" \
              -o "$cached"
          fi
          # Verify both downloads and cache hits before extraction.
          echo "$SING_BOX_SHA256  $cached" | sha256sum -c -
          tar -xzf "$cached" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sing-box-${SING_BOX_VERSION}-linux-amd64" >> "$GITHUB_PATH"
      - name: Test parser, failure handling and SRS compilation
        run: SING_BOX=sing-box python -m unittest discover -s tests -v
      - name: Compile complete rule sets
        id: compile
        env:
          ALLOW_LARGE_CHANGES: ${{ inputs.allow_large_changes || false }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [ "$ALLOW_LARGE_CHANGES" = true ]; then
            options+=(--allow-large-changes)
          fi
          python scripts/compiler.py --diff-report "$RUNNER_TEMP/changes.json" \
            --build-report "$RUNNER_TEMP/build-report.json" "${options[@]}"
      - name: Write build summary
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome || 'skipped' }}
        run: >-
          python scripts/ci_summary.py --report "$RUNNER_TEMP/build-report.json"
          --output "$GITHUB_STEP_SUMMARY" --outcome "$COMPILE_OUTCOME"
      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-report
          path: ${{ runner.temp }}/build-report.json
          if-no-files-found: ignore
      - name: Upload verified rules
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiled-rules
          path: rules/
          if-no-files-found: error
      - name: Upload change report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: changes
          path: ${{ runner.temp }}/changes.json
          if-no-files-found: ignore
      - name: Upload source snapshots for reproduction
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-snapshots
          path: .cache/sources/*.gz
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  publish:
    needs: build
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compiled-rules
          path: ${{ runner.temp }}/compiled-rules
      - name: Publish complete generation
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete "$RUNNER_TEMP/compiled-rules/" rules/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all rules/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update service rule sets $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
