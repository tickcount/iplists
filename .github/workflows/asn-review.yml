name: Review ASN Candidates

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - data/**
      - requirements.txt
      - .github/workflows/asn-review.yml
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - data/**
      - requirements.txt
      - .github/workflows/asn-review.yml

permissions:
  contents: read

concurrency:
  group: asn-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.7"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test candidate review
        run: python -m unittest discover -s tests -p test_asn_review.py -v
      - name: Collect advisory candidates
        run: >-
          python scripts/asn_review.py
          --output "$RUNNER_TEMP/asn-review/asn-review.json"
          --summary "$RUNNER_TEMP/asn-review/asn-review.md"
      - name: Write review summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/asn-review/asn-review.md" ]; then
            cat "$RUNNER_TEMP/asn-review/asn-review.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ASN review did not produce a report; see setup/test logs. Selection is unchanged.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload review and source snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asn-review
          path: |
            ${{ runner.temp }}/asn-review/
            .cache/asn-review/*.gz
          retention-days: 30
          if-no-files-found: ignore
          include-hidden-files: true
